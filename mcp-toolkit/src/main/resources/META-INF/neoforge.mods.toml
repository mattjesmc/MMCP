# The NeoForge half of the unified jar. Fabric reads fabric.mod.json and ignores this file;
# NeoForge reads this and ignores that one. One artifact, two loaders — CROSS_LOADER_DESIGN.md §4.
modLoader = "javafml"
loaderVersion = "[1,)"
license = "MMCP License (see LICENSE)"

# The SAME mixin config the Fabric side declares, unmodified. Minecraft 26.x is unobfuscated, so
# there is no refmap to regenerate and no per-loader edit to make — verified by the Stage 0 spike.
[[mixins]]
config = "mcptoolkit.mixins.json"

# The NeoForge spelling of mcptoolkit.accesswidener's two entries. Same two members, same reason:
# they are what fabric-api's transitive access wideners used to open.
[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[mods]]
modId = "mcptoolkit"
version = "${version}"
displayName = "MCP Toolkit"
authors = "mattmc"
# The same file fabric.mod.json's "icon" names: jar root, generated by tools/icon.mjs. Pixel art, so
# no blur on the mods screen.
logoFile = "icon.png"
logoBlur = false
description = '''
A localhost HTTP bridge and tool registry that lets an external MCP server drive the game: run tools
on the server or client thread, inspect state, and control the client. A development/authoring tool.
'''

[[dependencies.mcptoolkit]]
modId = "neoforge"
type = "required"
versionRange = "[26.2,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.mcptoolkit]]
modId = "minecraft"
type = "required"
versionRange = "[26.2,)"
ordering = "NONE"
side = "BOTH"
