# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft / loader / Fabric API / mcp-toolkit versions come from the com.mattmc.mcmod convention
# plugin. To pin this repository to something different, set the key here and it wins:
#   minecraft_version / loader_version / fabric_version / mcptoolkit_version

# THE PORT IS THE PROJECT CONSTANT. It is what this repository's dev game binds its MCP bridge to,
# and what every MCP registration in this repository (.mcp.json and friends) must name -
# `gradlew toolkitInit` writes them from this one number and corrects one that disagrees. Two dev
# games on one machine must not share a port: the second to boot loses the bind and its session
# drives the FIRST game's world. Pick one nobody else on this machine uses (the toolkit's own is
# 25599; the workbench allocates 25641 upward).
mcmod.port=25650

# Mod
mod_version=0.1.0
maven_group=com.example.examplemod
archives_base_name=examplemod
