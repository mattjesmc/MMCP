# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# This project IS mcp-toolkit, so the convention plugin must not add an mcp-toolkit dependency here.
mcmod.toolkit=false

# No `mcmod.port` here on purpose: the toolkit's own dev game IS what BridgeConfig.DEV_DEFAULT_PORT
# (25599) names, and its build.gradle wires -Pport itself (the plugin's wiring is gated on the
# toolkit being a DEPENDENCY, which here it cannot be). Every other repo in the workspace declares
# a port of its own so it never collides with this one.

# Screen authoring (SCREEN_AUTHORING_DESIGN.md section 7.1). The toolkit compiles its own example
# document the same way a consumer mod does, and this is the key the convention plugin's generateUi
# reads there. It is declared HERE rather than hard-coded in build.gradle so that `ui_doc
# op:"generate"` - which runs the same emitter in-process, from the live game - discovers the same
# package the build would pass. One place says where generated screen code goes.
mcmod.ui.package=com.mattmc.mcptoolkit.ui.sample

# Minecraft/loader/Fabric-API versions come from the com.mattmc.mcmod convention plugin
# (mcmodding/gradle-conventions/). Set minecraft_version / loader_version / fabric_version here only
# to PIN this repo to something different from the workspace default.
#
# fabric-api is a DEV-RUN dependency only (localRuntime in build.gradle) - see the note there. The
# toolkit's own version lives in build.gradle, next to the changelog that explains each bump.
